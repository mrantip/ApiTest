services:
  # НОВЫЙ бэкенд с fraud check (для тестирования с моками)
  nbank:
    image: nobugsme/nbank:with_fraud_check_with_transfer_fix
    container_name: nbank-app
    ports:
      - "4112:4111"  # ← новый порт, чтобы не конфликтовать с другими
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      # Все возможные варианты названий переменной
      - FRAUD_DETECTION_SERVICE_URL=http://host.docker.internal:8090
      - fraud.detection.service.url=http://host.docker.internal:8090
      - fraud.service.url=http://host.docker.internal:8090
      - FRAUD_SERVICE_URL=http://host.docker.internal:8090
      - fraud-check.service.url=http://host.docker.internal:8090
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nbank-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4111/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    image: nobugsme/nbank:with_database_with_fix
    ports:
      - "4111:4111"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    depends_on:
      postgres:
        condition: service_healthy  # Ждать пока postgres не будет готов
    networks:
      - nbank-network

  # СТАРЫЙ бэкенд (с валидацией) - работает на порту 4110
  backend-validation:
    image: nobugsme/nbank:latest  # ← образ для старой версии
    container_name: nbank-backend-old
    ports:
      - "4110:4111"  # ← маппим на порт 4110 (можно изменить)
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nbank-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=nbank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - nbank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nbank"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  nbank-network:
    name: nbank-network

volumes:
  postgres_data:
    driver: local